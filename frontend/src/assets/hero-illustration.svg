<svg viewBox="0 0 1440 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroIllustrationTitle">
  <title id="heroIllustrationTitle">Online trener vodi klijenta kroz vežbe putem video poziva</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ea" />
      <stop offset="1" stop-color="#dcefe0" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163d27" />
      <stop offset="1" stop-color="#0e2a1c" />
    </linearGradient>
  </defs>

  <rect width="1440" height="960" fill="url(#bgGrad)" />

  <!-- device / video call window -->
  <g>
    <rect x="220" y="140" width="1000" height="640" rx="28" fill="url(#screenGrad)" />

    <!-- window chrome -->
    <circle cx="270" cy="190" r="7" fill="#c8f169" opacity="0.9" />
    <circle cx="296" cy="190" r="7" fill="#f2f7f0" opacity="0.35" />
    <circle cx="322" cy="190" r="7" fill="#f2f7f0" opacity="0.35" />
    <rect x="980" y="178" width="160" height="24" rx="12" fill="#f2f7f0" opacity="0.12" />
    <circle cx="1004" cy="190" r="5" fill="#c8f169" />
    <text x="1018" y="195" font-family="system-ui, sans-serif" font-size="14" fill="#f2f7f0" opacity="0.85">UŽIVO</text>

    <!-- divider between two call tiles -->
    <line x1="720" y1="240" x2="720" y2="700" stroke="#f2f7f0" stroke-opacity="0.1" stroke-width="2" />

    <!-- trainer tile (left) -->
    <g>
      <circle cx="470" cy="430" r="120" fill="#1f6f43" opacity="0.9" />
      <circle cx="470" cy="385" r="46" fill="#f2f7f0" opacity="0.92" />
      <path d="M380 500c0-50 40-86 90-86s90 36 90 86" fill="#f2f7f0" opacity="0.92" />
      <rect x="400" y="610" width="140" height="28" rx="14" fill="#f2f7f0" opacity="0.14" />
      <text x="470" y="629" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f2f7f0">Trener</text>
    </g>

    <!-- client tile (right) -->
    <g>
      <circle cx="970" cy="430" r="120" fill="#c8f169" opacity="0.22" />
      <circle cx="970" cy="385" r="46" fill="#c8f169" />
      <path d="M880 500c0-50 40-86 90-86s90 36 90 86" fill="#c8f169" />
      <rect x="900" y="610" width="140" height="28" rx="14" fill="#f2f7f0" opacity="0.14" />
      <text x="970" y="629" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#f2f7f0">Klijent</text>
    </g>

    <!-- bottom call controls -->
    <g opacity="0.9">
      <circle cx="660" cy="730" r="22" fill="#f2f7f0" opacity="0.12" />
      <circle cx="720" cy="730" r="24" fill="#dc2626" />
      <circle cx="780" cy="730" r="22" fill="#f2f7f0" opacity="0.12" />
    </g>
  </g>

  <!-- floating reps / progress card -->
  <g transform="translate(900,80)">
    <rect width="300" height="120" rx="20" fill="#ffffff" />
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#0b130d">Današnji trening</text>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#5b6b60">Čučnjevi · 4 serije x 12</text>
    <rect x="24" y="84" width="252" height="10" rx="5" fill="#eaf3ea" />
    <rect x="24" y="84" width="180" height="10" rx="5" fill="#1f6f43" />
  </g>

  <!-- heartbeat / activity line accent -->
  <polyline points="120,860 260,860 300,800 340,900 380,820 420,860 1320,860"
    fill="none" stroke="#1f6f43" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />
</svg>
